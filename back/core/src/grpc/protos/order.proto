syntax = "proto3";

package order;

// Basic types
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_FULFILLED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

message OrderItemInput {
  string product_id = 1;
  string variant_id = 2;
  uint32 qty = 3;
  double unit_price = 4;
  string title = 5;
  string sku = 6;
  string attrs_json = 7; // JSON string for snapshot attributes
}

message CreateOrderRequest {
  string customer_id = 1;
  string contact_email = 2;
  string currency = 3;
  string shipping_address_json = 4;
  string billing_address_json = 5; // optional, can be empty
  repeated OrderItemInput items = 6;
  double discounts = 7;
  double tax = 8;
  double shipping = 9;
}

message Order {
  string id = 1;
  string customer_id = 2;
  string contact_email = 3;
  double subtotal = 4;
  double discount_total = 5;
  double tax_total = 6;
  double shipping_total = 7;
  double grand_total = 8;
  string currency = 9;
  OrderStatus status = 10;
  string created_at = 11;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersForCustomerRequest {
  string customer_id = 1;
}

message ListOrdersForCustomerResponse {
  repeated Order orders = 1;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  OrderStatus new_status = 2;
  string reason = 3;
  string metadata_json = 4;
}

message UpdateOrderStatusResponse {
  Order order = 1;
}

message CreateOrderResponse {
  Order order = 1;
}

// Service definition
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrdersForCustomer(ListOrdersForCustomerRequest) returns (ListOrdersForCustomerResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
}
