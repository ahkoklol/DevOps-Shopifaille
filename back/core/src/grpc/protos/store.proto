syntax = "proto3";
package core.store.v1;

message StoreId { string id = 1; }

message Store {
  string id = 1;
  string owner_user_id = 2;
  string name = 3;
  string subdomain = 4;
  string custom_domain = 5;
  string plan = 6;
  string created_at = 7;
}

message ListCategoriesRequest { string store_id = 1; }
message Category {
  string id = 1;
  string store_id = 2;
  string parent_category_id = 3;
  string name = 4;
  string slug = 5;
  int32 sort_order = 6;
}
message ListCategoriesResponse { repeated Category items = 1; }

service StoreService {
  rpc GetStore (StoreId) returns (Store);
  rpc ListCategories (ListCategoriesRequest) returns (ListCategoriesResponse);
}
