syntax = "proto3";

package accounts;

// Customer
message Customer {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  string created_at = 6;
}

message CreateCustomerRequest {
  string email = 1;
  string first_name = 2;
  string last_name = 3;
  string phone = 4;
  string password = 5;
}

message CreateCustomerResponse {
  Customer customer = 1;
}

message GetCustomerRequest {
  string id = 1;
}

message GetCustomerResponse {
  Customer customer = 1;
}

message FindCustomerByEmailRequest {
  string email = 1;
}

message FindCustomerByEmailResponse {
  Customer customer = 1;
}

// Address
message Address {
  string id = 1;
  string customer_id = 2;
  string label = 3;
  string address_json = 4;
  string created_at = 5;
}

message CreateAddressRequest {
  string customer_id = 1;
  string label = 2;
  string address_json = 3;
}

message CreateAddressResponse {
  Address address = 1;
}

message ListAddressesRequest {
  string customer_id = 1;
}

message ListAddressesResponse {
  repeated Address addresses = 1;
}

// OrderRef
message OrderRef {
  string id = 1;
  string customer_id = 2;
  string order_id = 3;
  string created_at = 4;
}

message CreateOrderRefRequest {
  string customer_id = 1;
  string order_id = 2;
}

message CreateOrderRefResponse {
  OrderRef ref = 1;
}

service CustomerService {
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  rpc FindCustomerByEmail(FindCustomerByEmailRequest) returns (FindCustomerByEmailResponse);
}

service AddressService {
  rpc CreateAddress(CreateAddressRequest) returns (CreateAddressResponse);
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);
}

service OrderRefService {
  rpc CreateOrderRef(CreateOrderRefRequest) returns (CreateOrderRefResponse);
}
