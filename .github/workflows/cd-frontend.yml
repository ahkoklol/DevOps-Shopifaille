name: Frontend CD - Build & Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'front/**' 
      
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessary to push the Docker image to GHCR
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Preparation & Build (To generate 'dist' folder) ---
      
      # Set up Node environment (Node 22 is used per your CI/Dockerfile)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies and Build (In front/)
        # These steps run inside the 'front' directory to prepare the build context for Docker
        working-directory: front 
        run: |
          npm install 
          npm run build
          
      # --- 2. Docker Build and Push to GHCR ---
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in GITHUB_TOKEN has permission to push to packages associated with this repository.
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          # Use the repository root as the build context since the Dockerfile references 'front/' contents
          context: . 
          # Specify the Dockerfile path
          file: ./front/Dockerfile
          push: true
          # Define the image tags (latest is used for continuous deployment)
          tags: ghcr.io/${{ github.repository_owner }}/shopifaille-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Image Pushed Confirmation
        run: echo "Successfully pushed image to ghcr.io/${{ github.repository_owner }}/shopifaille-frontend:latest"