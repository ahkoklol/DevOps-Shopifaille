name: Frontend CD - Build & Push to GHCR & Docker Hub

on:
  push:
    branches:
      - main
      - wayne-kubernetes # Temporary branch for Kubernetes testing
    paths:
      - "front/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessary to push the Docker image to GHCR

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Preparation & Build (To generate 'dist' folder) ---

      # Set up Node environment (Node 22 is used per your CI/Dockerfile)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies and Build (In front/)
        working-directory: front
        run: |
          npm install
          npm run build

      # --- 2. Docker Logins ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # Uses ${{ github.repository_owner }} as the confirmed Docker Hub username
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- 3. Docker Build and Push to Both Registries ---

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          # Use the repository root as the build context since the Dockerfile references 'front/' contents
          context: ./front
          # Specify the Dockerfile path
          file: ./front/Dockerfile
          push: true
          # Tags for both GHCR and Docker Hub
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopifaille-frontend:latest
            ${{ github.repository_owner }}/shopifaille-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image Pushed Confirmation
        run: echo "Successfully pushed image to GHCR and Docker Hub (${{ github.repository_owner }}/shopifaille-frontend:latest)"
