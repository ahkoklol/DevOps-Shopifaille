# .github/workflows/ci-backend-checkout.yml

name: Checkout Microservice CI (Build & Test)

on:
  # Triggers for all pushes and pull requests targeting the main or dev branches
  push:
    branches:
      - main
      - dev
    paths:
      # Only run if files in the checkout directory have changed
      - 'back/checkout/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'back/checkout/**'

# Define global settings for the job
defaults:
  run:
    # Set the default working directory to the checkout service folder
    working-directory: back/checkout

jobs:
  build_and_test:
    name: Build, Test, and Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          # Java 21 is specified in back/checkout/build.gradle.kts
          java-version: '21'
          distribution: 'temurin'
          # Enable built-in Gradle dependency caching
          cache: 'gradle'
          
      - name: Grant execution permission for gradlew
        # Make the Gradle wrapper script executable for Linux runners
        run: chmod +x gradlew
        
      - name: Build and Test with Gradle
        # The 'build' task typically runs: assemble (compile), check (lint/test), and build.
        # The '--no-daemon' flag is often used to prevent cache-related issues in CI.
        run: ./gradlew build --no-daemon
        
      - name: Upload Build Artifact (Optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-jar
          # Path to the generated Spring Boot JAR file (adjust if needed)
          path: back/checkout/build/libs/*.jar