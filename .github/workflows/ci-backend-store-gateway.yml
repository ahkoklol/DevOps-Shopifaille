# .github/workflows/ci-backend-store-gateway.yml

name: Store Gateway CI (Build & Test)

on:
  # Triggers for all pushes and pull requests targeting the main or dev branches
  push:
    branches:
      - main
      - dev
    paths:
      # Only run if files in the new store-gateway directory have changed
      - 'back/store-gateway/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'back/store-gateway/**'

# Define global settings for the job
defaults:
  run:
    # Set the default working directory to the store-gateway service folder
    working-directory: back/store-gateway

jobs:
  build_and_test:
    name: Build, Test, and Package Gateway
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Build and Test with Maven
        # The '-B' flag runs in batch mode (non-interactive).
        # Assuming the Maven executable is on the PATH after setup-java.
        run: mvn -B package
        
      - name: Upload Build Artifact (Optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: store-gateway-jar
          # CORRECTED: Path to the generated Spring Boot JAR file (Maven convention: target folder)
          path: back/store-gateway/target/*.jar