# .github/workflows/ci-backend-store-gateway.yml

name: Store Gateway CI (Build & Test)

on:
  # Triggers for all pushes and pull requests targeting the main or dev branches
  push:
    branches:
      - main
      - dev
    paths:
      # Only run if files in the new store-gateway directory have changed
      - 'back/store-gateway/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'back/store-gateway/**'

# Define global settings for the job
defaults:
  run:
    # Set the default working directory to the new store-gateway service folder
    working-directory: back/store-gateway

jobs:
  build_and_test:
    name: Build, Test, and Package Gateway
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          # Use JDK 21, consistent with your checkout service
          java-version: '21'
          distribution: 'temurin'
          # Enable built-in Gradle dependency caching
          cache: 'gradle'
          
      - name: Grant execution permission for gradlew
        # Make the Gradle wrapper script executable for Linux runners
        run: chmod +x gradlew
        
      - name: Build and Test with Gradle
        # The 'build' task will compile the Java code and run tests.
        run: ./gradlew build --no-daemon
        
      - name: Upload Build Artifact (Optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: store-gateway-jar
          # Path to the generated Spring Boot JAR file (adjust if needed)
          path: back/store-gateway/build/libs/*.jar