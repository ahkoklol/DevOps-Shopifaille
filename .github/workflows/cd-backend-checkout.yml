name: Checkout Microservice CD - Build, Push to GHCR

on:
  push:
    branches:
      - main # Trigger CD only on merges to main
    paths:
      - "back/checkout/**"
      - "kubernetes/checkout-deployment.yaml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessary to push Docker image to GHCR

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. CI/Build (Must be repeated to create the build output for Docker) ---

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and Test with Maven
        # Set working directory to the service folder for Maven execution
        working-directory: back/checkout
        run: mvn -B package -DskipTests

      # --- 2. Docker Build and Push to GHCR ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          # Use the service directory as the build context
          context: ./back/checkout
          file: ./back/checkout/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/checkout-service:latest

      # --- 3. Kubernetes Deployment 🚀 ---

      - name: Setup Kubeconfig
        # This action automatically configures kubectl using the KUBE_CONFIG_DATA secret
        uses: D630/setup-kubeconfig-action@v1.1
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Deploy to Kubernetes
        # Applies the manifest, which either creates the service or performs a rolling update
        run: kubectl apply -f kubernetes/checkout-deployment.yaml
