name: Store Gateway CD - Build, Push to GHCR

on:
  push:
    branches:
      - main # Trigger CD only on merges to main
    paths:
      - "back/store-gateway/**"
      # Path to the deployment file, to be used later
      - "kubernetes/store-gateway-deployment.yaml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessary to push Docker image to GHCR

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. CI/Build (Ensures JAR is built for Docker context) ---

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and Package with Maven
        working-directory: back/store-gateway
        # Run Maven to compile code and produce the JAR in target/
        run: mvn -B package -DskipTests

      # --- 2. Docker Build and Push to GHCR (The CD Action) ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          # Context points to the service directory for Docker to find the Dockerfile, pom.xml, and target/
          context: ./back/store-gateway
          file: ./back/store-gateway/Dockerfile
          push: true
          # Tag the image using the standardized service name
          tags: ghcr.io/${{ github.repository_owner }}/store-gateway-service:latest

      - name: Image Pushed Confirmation
        run: echo "Store Gateway image successfully pushed to ghcr.io/${{ github.repository_owner }}/store-gateway-service:latest"
