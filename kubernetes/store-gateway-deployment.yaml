# store-gateway-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-gateway
  labels:
    app: store-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: store-gateway
  template:
    metadata:
      labels:
        app: store-gateway
    spec:
      containers:
        - name: store-gateway
          image: yanisbaroudi/store-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PRODUCTS_SERVICE_URL
              value: "http://products-service:8080" # DNS interne du service products
            - name: CHECKOUT_SERVICE_URL
              value: "http://checkout-service:8080" # DNS interne du service checkout
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: CORE_SERVICE_URL
              value: "http://core-service:8080"

          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: store-gateway
  labels:
    app: store-gateway
spec:
  type: ClusterIP
  selector:
    app: store-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
