apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopyfaille-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopyfaille-frontend
  template:
    metadata:
      labels:
        app: shopyfaille-frontend
    spec:
      containers:
        - name: shopyfaille-frontend
          image: shopyfaille-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: shopyfaille-frontend-service
spec:
  type: NodePort
  selector:
    app: shopyfaille-frontend
  ports:
    - port: 80 # Port du service dans le cluster
      targetPort: 80 # Port dans le conteneur Nginx
      nodePort: 30080 # Port exposé sur ta machine via Minikube
